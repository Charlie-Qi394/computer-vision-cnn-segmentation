[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-portfolio"
version = "0.1.0"
description = "Sanitized computer vision portfolio utilities for classical CV, CNN classification and segmentation."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-image>=0.21",
  "matplotlib>=3.7",
  "pandas>=2.0"
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
deep-learning = ["tensorflow>=2.15"]

[tool.setuptools.packages.find]
where = ["src"]
